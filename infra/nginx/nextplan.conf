# /etc/nginx/sites-available/nextplan
# ⚠️ 재구성본: EC2 삭제로 원본 파일이 남아있지 않아 당시 구성(80 → Spring Boot 8080
#    리버스 프록시, access.log로 요청 도달 확인)을 기준으로 다시 작성한 파일입니다.

server {
    listen 80;
    server_name _;

    # Spring multipart 한도(50MB)와 맞춤. Nginx 기본값은 1MB라 큰 파일은 413 발생
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # CloudFront에서 받은 원래 스킴

        # 업로드 + 외부 API 호출 고려
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
